<svg viewBox="0 0 1000 296" width="1000" height="296" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Anatomy of an Enclave session: the developer, the project worktree, extra mounts, secrets and a persistent store feed an ephemeral sandbox that runs the AI coding agent; all sandbox traffic leaves through a filtering gateway that allows or blocks it. Four numbered labels mark the four controls: one, SEE, on the mounted files and secrets; two, RUN, on the sandbox; three, REACH, on the gateway; four, KEEP, on the store.">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#8b93a3"/></marker>
    <marker id="a-ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#7bb0ff"/></marker>
    <marker id="a-ac-s" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto"><polygon points="8 0, 1 3, 8 6" fill="#7bb0ff"/></marker>
    <marker id="a-am" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#e0a458"/></marker>
    <marker id="a-gn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#6ee7b7"/></marker>
    <marker id="a-rd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#fca5a5"/></marker>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- What the developer passes in -->
  <rect x="96" y="74" width="140" height="44" rx="12" fill="#12294a" stroke="#2f4d78" stroke-width="1.5"/>
  <text x="166" y="95" text-anchor="middle" style="font-size:12.5px" font-weight="700" fill="#bcd3ff">Developer</text>
  <text x="166" y="110" text-anchor="middle" style="font-size:9.5px" fill="#9aa2b1">CLI</text>

  <rect x="96" y="124" width="140" height="28" rx="8" fill="#0f2036" stroke="#1c3559"/>
  <text x="166" y="142" text-anchor="middle" style="font-size:10.5px" fill="#e5e7eb">Project worktree</text>
  <rect x="96" y="158" width="140" height="28" rx="8" fill="#0f2036" stroke="#1c3559"/>
  <text x="166" y="176" text-anchor="middle" style="font-size:10.5px" fill="#e5e7eb">Extra mounts</text>
  <rect x="96" y="192" width="140" height="28" rx="8" fill="#0f2036" stroke="#1c3559"/>
  <text x="166" y="210" text-anchor="middle" style="font-size:10.5px" fill="#e5e7eb">Secrets</text>

  <rect x="96" y="226" width="140" height="44" rx="10" fill="#0f2444" stroke="#2f4d78" stroke-width="1.5"/>
  <text x="166" y="246" text-anchor="middle" style="font-size:11.5px" font-weight="700" fill="#bcd3ff">Store</text>
  <text x="166" y="260" text-anchor="middle" style="font-size:8px" fill="#aab2c0">auth · config · history · memory</text>

  <!-- Feeds into the sandbox -->
  <line x1="236" y1="96" x2="344" y2="96" stroke="#7bb0ff" stroke-width="1.6" marker-end="url(#a-ac)"/>
  <text x="290" y="89" text-anchor="middle" style="font-size:9px" fill="#9aa2b1">manages</text>
  <line x1="236" y1="138" x2="344" y2="138" stroke="#8b93a3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="236" y1="172" x2="344" y2="172" stroke="#8b93a3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="236" y1="206" x2="344" y2="206" stroke="#8b93a3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="290" y="200" text-anchor="middle" style="font-size:8.5px" fill="#9aa2b1">credentials masked</text>
  <line x1="238" y1="248" x2="344" y2="248" stroke="#7bb0ff" stroke-width="1.6" marker-end="url(#a-ac)" marker-start="url(#a-ac-s)"/>
  <text x="290" y="241" text-anchor="middle" style="font-size:8.5px" fill="#9aa2b1">restored, reconciled</text>

  <!-- Sandbox -->
  <rect x="346" y="44" width="380" height="238" rx="14" fill="#0c1f3a" stroke="#7bb0ff" stroke-width="1.8"/>
  <text x="536" y="64" text-anchor="middle" style="font-size:11.5px" font-weight="800" letter-spacing="0.06em" fill="#7bb0ff">SANDBOX</text>
  <rect x="362" y="74" width="348" height="44" rx="10" fill="#12294a" stroke="#2f4d78"/>
  <text x="536" y="95" text-anchor="middle" style="font-size:12px" font-weight="700" fill="#e5e7eb">AI coding agent</text>
  <text x="536" y="110" text-anchor="middle" style="font-size:9px" fill="#aab2c0">Claude · Codex · OpenCode · …</text>
  <rect x="362" y="124" width="348" height="28" rx="8" fill="#0f2036" stroke="#1c3559"/>
  <text x="536" y="142" text-anchor="middle" style="font-size:10.5px" fill="#e5e7eb">Mounted project worktree</text>
  <rect x="362" y="158" width="348" height="28" rx="8" fill="#0f2036" stroke="#1c3559"/>
  <text x="536" y="176" text-anchor="middle" style="font-size:10.5px" fill="#e5e7eb">Extra mounts (docs, deps)</text>
  <rect x="362" y="192" width="348" height="40" rx="8" fill="#0f2444" stroke="#2f4d78"/>
  <text x="536" y="210" text-anchor="middle" style="font-size:9.5px" font-family="'JetBrains Mono', monospace" fill="#aab2c0">ANTHROPIC_API_KEY=<tspan fill="#7bb0ff" font-weight="700">••••••</tspan></text>
  <text x="536" y="224" text-anchor="middle" style="font-size:8.5px" fill="#9aa2b1">placeholder; the gateway inserts the real value</text>
  <text x="536" y="252" text-anchor="middle" style="font-size:9.5px" fill="#9aa2b1">Docker or Podman · isolated filesystem and network</text>
  <text x="536" y="267" text-anchor="middle" style="font-size:9.5px" fill="#9aa2b1">Ephemeral container per session</text>

  <!-- Sandbox to gateway -->
  <line x1="726" y1="96" x2="824" y2="96" stroke="#e0a458" stroke-width="1.6" marker-end="url(#a-am)"/>
  <text x="775" y="88" text-anchor="middle" style="font-size:9px" fill="#9aa2b1">all traffic</text>

  <!-- Gateway -->
  <rect x="826" y="44" width="160" height="144" rx="14" fill="#0c1f3a" stroke="#e0a458" stroke-width="1.8"/>
  <text x="906" y="64" text-anchor="middle" style="font-size:11.5px" font-weight="800" letter-spacing="0.06em" fill="#e0a458">GATEWAY</text>
  <rect x="840" y="74" width="132" height="30" rx="8" fill="#2a2416" stroke="#6b5320"/>
  <text x="906" y="93" text-anchor="middle" style="font-size:10px" fill="#e0c088">DNS allowlist</text>
  <rect x="840" y="110" width="132" height="30" rx="8" fill="#2a2416" stroke="#6b5320"/>
  <text x="906" y="129" text-anchor="middle" style="font-size:10px" fill="#e0c088">Transparent proxy</text>
  <rect x="840" y="146" width="132" height="30" rx="8" fill="#2a2416" stroke="#6b5320"/>
  <text x="906" y="165" text-anchor="middle" style="font-size:10px" fill="#e0c088">Network log</text>

  <!-- Outcomes -->
  <line x1="862" y1="188" x2="862" y2="214" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#a-gn)"/>
  <line x1="950" y1="188" x2="950" y2="214" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#a-rd)"/>
  <rect x="826" y="216" width="72" height="34" rx="17" fill="#0f2a20" stroke="#157f5f"/>
  <text x="862" y="238" text-anchor="middle" style="font-size:10.5px" font-weight="600" fill="#6ee7b7">Allowed</text>
  <rect x="914" y="216" width="72" height="34" rx="17" fill="#2a1414" stroke="#7f2a2a"/>
  <text x="950" y="238" text-anchor="middle" style="font-size:10.5px" font-weight="600" fill="#fca5a5">Blocked</text>

  <!-- Annotations: the four controls, revealed in order -->
  <g>
    <path d="M96 124 h-8 v96 h8" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <line x1="80" y1="172" x2="88" y2="172" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="8" y="160" width="72" height="24" rx="12" fill="url(#badge)"/>
    <circle cx="23" cy="172" r="8" fill="#ffffff"/>
    <text x="23" y="176" text-anchor="middle" style="font-size:10.5px" font-weight="700" fill="#4f46e5">1</text>
    <text x="56.5" y="176" text-anchor="middle" style="font-size:10px" font-weight="700" letter-spacing="0.05em" fill="#0c1f3a">SEE</text>
  </g>

  <g>
    <line x1="410" y1="30" x2="410" y2="44" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="374" y="6" width="72" height="24" rx="12" fill="url(#badge)"/>
    <circle cx="389" cy="18" r="8" fill="#ffffff"/>
    <text x="389" y="22" text-anchor="middle" style="font-size:10.5px" font-weight="700" fill="#4f46e5">2</text>
    <text x="422.5" y="22" text-anchor="middle" style="font-size:10px" font-weight="700" letter-spacing="0.05em" fill="#0c1f3a">RUN</text>
  </g>

  <g>
    <line x1="906" y1="30" x2="906" y2="44" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="870" y="6" width="72" height="24" rx="12" fill="url(#badge)"/>
    <circle cx="885" cy="18" r="8" fill="#ffffff"/>
    <text x="885" y="22" text-anchor="middle" style="font-size:10.5px" font-weight="700" fill="#4f46e5">3</text>
    <text x="918.5" y="22" text-anchor="middle" style="font-size:10px" font-weight="700" letter-spacing="0.05em" fill="#0c1f3a">REACH</text>
  </g>

  <g>
    <line x1="80" y1="248" x2="96" y2="248" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="8" y="236" width="72" height="24" rx="12" fill="url(#badge)"/>
    <circle cx="23" cy="248" r="8" fill="#ffffff"/>
    <text x="23" y="252" text-anchor="middle" style="font-size:10.5px" font-weight="700" fill="#4f46e5">4</text>
    <text x="56.5" y="252" text-anchor="middle" style="font-size:10px" font-weight="700" letter-spacing="0.05em" fill="#0c1f3a">KEEP</text>
  </g>
</svg>
