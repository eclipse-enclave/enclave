schemaVersion: "3"
kind: workload
displayName: Mistral Vibe
description: Mistral Vibe CLI coding assistant

capabilities:
  - type: org.eclipse.enclave/runtime@1
    config:
      #
      # This program and the accompanying materials are made available under the
      # terms of the MIT License, which is available in the project root.
      #
      # SPDX-License-Identifier: MIT

      name: mistral-vibe
      defaultIncluded: false

      sandbox:
        entrypoint: { run: [vibe] }
        configDir: .vibe
        skillsDir: .vibe/skills
        settingsFile: mistral-vibe-config.toml
        settingsTarget: .vibe/config.toml
        yoloFlag: "--agent auto-approve"
        yoloEnabled: true
        continueArgs: [--continue]
        passthroughPaths: [config.toml, agents/, prompts/, skills/]

      providers:
        - name: mistral
