schemaVersion: "1"
kind: sandbox
name: theia-next
displayName: Theia IDE (Next)
description: Theia Next (preview) desktop IDE attached to an enclave container

sandbox:
  entrypoint: { run: [sleep, infinity] }
  configDir: .theia-ide-next
  passthroughPaths: [deployedPlugins/]
  statePaths:
    # Backend state that must survive the passthrough overlay, which rebuilds
    # the store on every start: extension data and storage, workspace data,
    # custom AI prompts, AI chat history, model snapshots, backend settings,
    # and recent workspaces.
    - globalStorage/
    - plugin-storage/
    - workspace-storage/
    - workspace-metadata/
    - prompt-templates/
    - chatSessions/
    - model-snapshots/
    - backend-settings.json
    - recentworkspace.json

postStart:
  openIDE: theia-next

credentials:
  sources:
    # Clients tell Anthropic API keys and OAuth tokens apart by their prefixes.
    anthropic-api-key:
      env: [ANTHROPIC_API_KEY]
      placeholder: { prefix: "sk-ant-api03-", suffix: "AA", random: { encoding: base64url, length: 93 } }
    # Clients tell OpenAI API keys from ChatGPT tokens by the sk- prefix.
    openai-api-key:
      env: [OPENAI_API_KEY]
      placeholder: { prefix: "sk-enclave-", random: { encoding: alphanumeric, length: 48 } }
    gemini-api-key: { env: [GEMINI_API_KEY] }

network:
  serviceDomains:
    api.anthropic.com: anthropic-api-key
    "*.anthropic.com": anthropic-api-key
    api.openai.com: openai-api-key
    "*.openai.com": openai-api-key
    generativelanguage.googleapis.com: gemini-api-key
  serviceAuth:
    anthropic-api-key: { headerName: x-api-key }
    openai-api-key: { headerName: authorization, valueFormat: "Bearer %s" }
    gemini-api-key: { headerName: x-goog-api-key }

providers:
  - name: anthropic
    credentials: [anthropic-api-key]
  - name: openai
    credentials: [openai-api-key]
  - name: google
    credentials: [gemini-api-key]
