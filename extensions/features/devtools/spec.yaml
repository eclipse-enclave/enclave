schemaVersion: "3"
kind: mixin
displayName: Development Tools
description: Core development tools (vim, htop, ripgrep, etc.)

capabilities:
  - type: org.eclipse.enclave/runtime@1
    config:
      #
      # This program and the accompanying materials are made available under the
      # terms of the MIT License, which is available in the project root.
      #
      # SPDX-License-Identifier: MIT

      name: devtools
      priority: 40
      failOnInstallError: true
      aptPackages:
        - vim
        - nano
        - htop
        - tree
        - golang-go
        - rpm
        - shellcheck
        - yq
        - ripgrep
        - fd-find
        - netcat-openbsd
        - socat
        - dnsutils
        - iputils-ping
        - xxd
