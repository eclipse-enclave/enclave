# Enclave DNS Allowlist Configuration - Antigravity CLI
no-resolv
no-poll
address=/#/

# Antigravity product site and docs
server=/antigravity.google/8.8.8.8

# Google sign-in: OAuth authorization, token exchange/refresh, user info
server=/accounts.google.com/8.8.8.8
server=/oauth2.googleapis.com/8.8.8.8
server=/www.googleapis.com/8.8.8.8

# Model and agent backends (Cloud Code / AI Code endpoints used by agy)
server=/cloudcode-pa.googleapis.com/8.8.8.8
server=/aicode.googleapis.com/8.8.8.8
server=/businessaicode.googleapis.com/8.8.8.8

# Gemini API (GEMINI_API_KEY with modelProvider "gemini")
server=/generativelanguage.googleapis.com/8.8.8.8

# Google Cloud / Gemini Enterprise sign-in (Business accounts, ADC, WIF).
# Regional Vertex AI endpoints are not covered; add them with --allow-domain.
server=/aiplatform.googleapis.com/8.8.8.8
server=/sts.googleapis.com/8.8.8.8
server=/iamcredentials.googleapis.com/8.8.8.8

# Common Infrastructure (plugin marketplace, MCP servers, package registries)
conf-file=/etc/dnsmasq.allowlists/fragments/github.conf
conf-file=/etc/dnsmasq.allowlists/fragments/npm.conf
conf-file=/etc/dnsmasq.allowlists/fragments/pypi.conf
conf-file=/etc/dnsmasq.allowlists/fragments/go.conf
conf-file=/etc/dnsmasq.allowlists/fragments/cdn.conf
conf-file=/etc/dnsmasq.allowlists/fragments/tls.conf
