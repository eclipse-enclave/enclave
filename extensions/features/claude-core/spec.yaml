schemaVersion: "3"
kind: mixin
displayName: Claude Core
description: Shared Claude installation, credentials, and network declarations
capabilities:
  - type: org.eclipse.enclave/runtime@1
    config:
      name: claude-core
      defaultEnabled: false
      priority: 30
      failOnInstallError: true
      credentials:
        sources:
          anthropic-api-key: { env: [ANTHROPIC_API_KEY] }
          claude-code-oauth-token: { env: [CLAUDE_CODE_OAUTH_TOKEN], apiKey: false }
      network:
        allowedDomains:
          - anthropic.com
          - claude.ai
          - platform.claude.com
          - console.anthropic.com
          - platform.anthropic.com
        serviceDomains:
          api.anthropic.com: anthropic-api-key
          "*.anthropic.com": anthropic-api-key
        serviceAuth:
          anthropic-api-key: { headerName: x-api-key }
