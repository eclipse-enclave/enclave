name: Reusable RPM Package Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner image for the Ubuntu RPM compatibility build.
        required: false
        type: string
        default: ubuntu-24.04
      artifact_name:
        description: Uploaded artifact name.
        required: false
        type: string
        default: rpm
      artifact_retention_days:
        description: Uploaded artifact retention in days.
        required: false
        type: number
        default: 7
      set_package_version:
        description: Set a commit-specific package version for rolling builds.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-rpm-ubuntu:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Set package version
        if: inputs.set_package_version
        run: echo "VERSION=$(./scripts/rolling-package-version.sh)" >> "$GITHUB_ENV"

      - name: Build RPM package
        run: make rpm

      - name: Verify packaged runtime assets
        run: |
          pkg=$(find dist -maxdepth 1 -name 'enclave-*.rpm' -print -quit)
          if [ -z "$pkg" ]; then
            echo "RPM package was not produced" >&2
            exit 1
          fi
          pkg=$(realpath "$pkg")
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          (cd "$tmpdir" && rpm2cpio "$pkg" | cpio -idm --quiet)
          ./scripts/verify-package-assets.sh "$tmpdir" usr/share/zsh/site-functions

  build-rpm-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y git golang make rpm-build cpio diffutils

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set package version
        if: inputs.set_package_version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(./scripts/rolling-package-version.sh)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build RPM package
        run: make rpm

      - name: Verify packaged runtime assets
        run: |
          pkg=$(find dist -maxdepth 1 -name 'enclave-*.rpm' -print -quit)
          if [ -z "$pkg" ]; then
            echo "RPM package was not produced" >&2
            exit 1
          fi
          pkg=$(realpath "$pkg")
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          (cd "$tmpdir" && rpm2cpio "$pkg" | cpio -idm --quiet)
          ./scripts/verify-package-assets.sh "$tmpdir" usr/share/zsh/site-functions

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.rpm
          retention-days: ${{ inputs.artifact_retention_days }}

  test-fedora:
    needs: build-rpm-fedora
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Install and remove RPM package
        run: |
          dnf install -y ./dist/enclave-*.x86_64.rpm
          rpm --query enclave
          docker --version
          docker buildx version
          enclave tools >/dev/null
          dnf remove -y enclave
          test ! -e /usr/bin/enclave
          test ! -e /usr/share/enclave
          test ! -e /usr/share/doc/enclave
