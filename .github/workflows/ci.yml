name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: CGO_ENABLED=0 make build BIN_DIR=.

      - name: Smoke test standalone binary
        run: ./scripts/smoke-standalone-binary.sh ./enclave

      - name: Cross-compile (macOS, Linux arm64, and Windows)
        run: make cross-build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-and-test-go-floor:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read minimum Go version
        id: go-floor
        run: echo "version=$(awk '/^go / { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-floor.outputs.version }}

      - name: Build CLI with minimum Go
        run: make build

      - name: Test with minimum Go
        run: make test

  smoke-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: CGO_ENABLED=0 make build BIN_DIR=. BINARY=enclave-darwin-arm64

      - name: Smoke test standalone binary
        run: ./scripts/smoke-standalone-binary.sh ./enclave-darwin-arm64

  # The Windows binary is the WSL launcher. GitHub-hosted windows runners have no
  # WSL2, so this job covers everything that does not need it; the empirical
  # wsl.exe round trip is the manual gate in scripts/wsl-shim-verify.ps1.
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build launcher
        run: go build ./cmd/enclave

      - name: Vet
        run: go vet ./...

      - name: Test launcher
        run: go test ./internal/wslshim/...

      - name: Parse verification script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/wsl-shim-verify.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          Write-Host 'scripts/wsl-shim-verify.ps1 parsed cleanly.'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Add Go tool bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Go lint tools
        run: ./scripts/install-go-linters.sh

      - name: Cache lint caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tmp/go-build
            .tmp/golangci-lint-cache
          key: lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            lint-${{ runner.os }}-

      - name: Lint
        run: make lint
