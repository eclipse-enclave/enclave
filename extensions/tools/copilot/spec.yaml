schemaVersion: "1"
kind: sandbox
name: copilot
displayName: Copilot CLI
description: Copilot CLI

sandbox:
  entrypoint: { run: [copilot, --disable-builtin-mcps, --disable-client-telemetry] }
  configDir: .copilot
  statePaths: [
    config.json,
    session-state/,
    sidebar-sessions-state/,
    command-history-state*,
    session-store.db*,
    permissions-config.json,
    mcp-oauth-config/,
    mcp-secrets/,
    installed-plugins/,
    plugin-data/
  ]
  qemuMinMemoryMiB: 4096
  skillsDir: .copilot/skills
  settingsFile: copilot-settings.json
  settingsTarget: .copilot/settings.json
  yoloFlag: --yolo
  yoloEnabled: true
  continueArgs: [--continue]
  resumeArgs: [--resume]
  passthroughPaths: [
    agents/,
    copilot-instructions.md,
    extensions/,
    hooks/,
    instructions/,
    lsp-config.json,
    mcp-config.json,
    providers.json,
    settings.json,
    skills/]

credentials:
  sources:
    copilot-native: { apiKey: false }
    copilot-github-token:
      env: [COPILOT_GITHUB_TOKEN]
      placeholder:
        prefix: github_pat_
        random: { encoding: alphanumeric, length: 82 }

network:
  serviceDomains:
    api.github.com: copilot-github-token
    "*.githubcopilot.com": copilot-github-token
  serviceAuth:
    copilot-native: { headerName: Authorization, valueFormat: "Bearer %s", hosts: [api.github.com, "*.githubcopilot.com"] }
    copilot-github-token: { headerName: Authorization, valueFormat: "Bearer %s" }

providers:
  - name: github
    authSecrets:
      - file: config.json
        codec: copilot-config
        fields:
          - { pointer: /authTokens/*/token, kind: access, release: copilot-native, placeholder: { prefix: gho_, random: { encoding: alphanumeric, length: 36 } } }
    tokenEndpoint:
      host: github.com
      path: /login/oauth/access_token
      body: either
      grants: ["urn:ietf:params:oauth:grant-type:device_code"]
      fields: { access: access_token, scope: scope }
    credentials: [copilot-github-token]
    authFiles: [config.json]
    authSession:
      mode: any
      checks:
        - { file: config.json, type: file_exists }
