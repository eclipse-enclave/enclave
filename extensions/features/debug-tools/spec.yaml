schemaVersion: "1"
kind: mixin
name: debug-tools
displayName: Debug Tools
description: Debugging and diagnostics tools (gdb, strace, valgrind, pidstat, ss, etc.)
defaultEnabled: false
priority: 80
aptPackages:
  - gdb
  - ltrace
  - strace
  - lsof
  - tcpdump
  - valgrind
  - sysstat
  - iproute2
  - file
