schemaVersion: "3"
kind: workload
displayName: Theia IDE (Next)
description: Theia Next (preview) desktop IDE attached to an enclave container

capabilities:
  - type: org.eclipse.enclave/runtime@1
    config:
      name: theia-next
      requiresFeatures: [claude-core]

      sandbox:
        entrypoint: { run: [sleep, infinity] }
        configDir: .theia

      postStart:
        openIDE: theia-next

      providers:
        - name: anthropic
          credentials: [anthropic-api-key]
