# SECURITY: uses pull_request_target (has secrets). Safe because it only triggers
# on PR close, checks out the base branch only, and runs no PR-controlled code.
# Do NOT add steps that execute repository scripts (npm install/run, etc.).

# Runs for every closed PR: a PR may drop its website changes after a deploy.

name: Remove website preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  remove-preview:
    runs-on: ubuntu-latest
    # Shares the deploy job's queue; see website-preview-deploy.yml.
    concurrency:
      group: website-preview-${{ github.event.pull_request.number }}
      queue: max
    steps:
      # A removal queued behind a reopened PR's deployments keeps its preview.
      - name: Check for a preview
        id: preview
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PR_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(GH_TOKEN=$PR_TOKEN gh api "repos/$REPO/pulls/$NUMBER" --jq .state)
          if [ "$state" = open ]; then
            echo "::notice::PR #$NUMBER is open again: keeping its preview"
          elif error=$(gh api "repos/eclipse-enclave/enclave-website-previews/contents/pr-previews/pr-$NUMBER?ref=previews" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ $error == *"(HTTP 404)"* ]]; then
            echo "::notice::PR #$NUMBER has no preview"
          else
            echo "$error" >&2
            exit 1
          fi
      - name: Checkout
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Keep the deploy token as the only push credential for pr-preview-action.
          persist-credentials: false
      - name: Remove preview
        id: deployment
        if: steps.preview.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          preview-branch: previews
          umbrella-dir: pr-previews
          deploy-repository: eclipse-enclave/enclave-website-previews
          token: ${{ secrets.DEPLOY_TOKEN }}
          action: remove
