schemaVersion: "1"
kind: sandbox
name: copilot
displayName: Copilot CLI
description: Copilot CLI

sandbox:
  entrypoint: { run: [copilot, --disable-builtin-mcps, --disable-client-telemetry] }
  configDir: .copilot
  statePaths: [
    config.json,
    session-state/,
    sidebar-sessions-state/,
    command-history-state*,
    session-store.db*,
    permissions-config.json,
    mcp-oauth-config/,
    mcp-secrets/,
    installed-plugins/,
    plugin-data/,
    a2a-harness/
  ]
  qemuMinMemoryMiB: 4096
  skillsDir: .copilot/skills
  settingsFile: copilot-settings.json
  settingsTarget: .copilot/settings.json
  yoloFlag: --yolo
  yoloEnabled: true
  continueArgs: [--continue]
  resumeArgs: [--resume]
  passthroughPaths: [
    agents/,
    copilot-instructions.md,
    extensions/,
    hooks/,
    instructions/,
    lsp-config.json,
    mcp-config.json,
    providers.json,
    settings.json,
    skills/]
  a2a:
    command: [copilot, --output-format, json, --disable-builtin-mcps, --disable-client-telemetry, --no-auto-update, --no-ask-user, --log-level, none, --sync-session=off]
    newSessionArgs: [--session-id, "{sessionId}"]
    resumeArgs: [--resume, "{sessionId}"]
    eventFormat: copilot-json
    versionCommand: [copilot, --no-auto-update, --version]
    versions: ">=1.0.105 <1.1.0"
    skills:
      - id: coding
        name: Coding
        description: Reads, edits and tests code in the worker's project and answers with a summary of what it did.
        tags: [code, review, refactor, test]
    orchestratorArgs: [--additional-mcp-config, "@/usr/local/share/enclave/templates/copilot-a2a-mcp.json"]

credentials:
  sources:
    copilot-github-token:
      env: [COPILOT_GITHUB_TOKEN]
      placeholder:
        prefix: github_pat_
        random: { encoding: alphanumeric, length: 82 }

network:
  serviceDomains:
    api.github.com: copilot-github-token
    "*.githubcopilot.com": copilot-github-token
  serviceAuth:
    copilot-github-token: { headerName: Authorization, valueFormat: "Bearer %s" }

providers:
  - name: github
    credentials: [copilot-github-token]
    authFiles: [config.json]
    authSession:
      mode: any
      checks:
        - { file: config.json, type: file_exists }
