schemaVersion: "1"
kind: sandbox
name: claude
displayName: Claude Code
description: Claude Code AI assistant

sandbox:
  entrypoint: { run: [claude] }
  configDir: .claude
  qemuMinMemoryMiB: 4096
  skillsDir: .claude/skills
  memoryDir: .claude/memory
  # Command-line settings take precedence over the baked settings template,
  # which opts auto-memory in, so this disables generation without the mount.
  noMemoryArgs: [--settings, '{"autoMemoryEnabled": false}']
  settingsFile: claude-settings.json
  settingsTarget: .claude/settings.json
  yoloFlag: --dangerously-skip-permissions
  yoloEnabled: true
  continueArgs: [--continue]
  resumeArgs: [--resume]
  passthroughPaths: [agents/, commands/, settings.json, skills/]
  hostConfigDir: .claude
  hostCredentialsFile: .credentials.json
  hostOauthJson: .claude.json
  a2a:
    command: [claude, -p, --output-format, stream-json, --verbose]
    newSessionArgs: [--session-id, "{sessionId}"]
    resumeArgs: [--resume, "{sessionId}"]
    eventFormat: claude-stream-json
    versionCommand: [claude, --version]
    # Lower bound: the version the stream-json facts were verified against (P2).
    versions: ">=2.1.306 <3.0.0"
    skills:
      - id: coding
        name: Coding
        description: Reads, edits and tests code in the worker's project and answers with a summary of what it did.
        tags: [code, review, refactor, test]
    # Appended after the prompt: --mcp-config is variadic and would swallow it.
    orchestratorArgs: [--mcp-config, /usr/local/share/enclave/templates/claude-a2a-mcp.json]

credentials:
  sources:
    anthropic-api-key: { env: [ANTHROPIC_API_KEY] }
    claude-code-oauth-token: { env: [CLAUDE_CODE_OAUTH_TOKEN], apiKey: false }

network:
  serviceDomains:
    api.anthropic.com: anthropic-api-key
    "*.anthropic.com": anthropic-api-key
  serviceAuth:
    anthropic-api-key: { headerName: x-api-key }
    claude-code-oauth-token: { headerName: authorization, valueFormat: "Bearer %s", hosts: [api.anthropic.com] }

providers:
  - name: anthropic
    credentials: [anthropic-api-key, claude-code-oauth-token]
    authFiles: [config.json, .credentials.json]
    securestorageDirEnv: CLAUDE_SECURESTORAGE_CONFIG_DIR
    authSession:
      mode: any
      checks:
        - { file: config.json, type: file_exists }
        - { file: .credentials.json, type: file_exists }
