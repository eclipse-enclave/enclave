schemaVersion: "1"
kind: sandbox
name: opencode
displayName: OpenCode
description: OpenCode terminal IDE

sandbox:
  entrypoint: { run: [opencode] }
  configDir: .config/opencode
  # opencode keeps its state in opencode.db (SQLite, WAL) inside the config
  # store, and WAL shared-memory files need mmap semantics on 9p.
  qemuStoreCacheMmap: true
  skillsDir: .config/opencode/skills
  statePaths:
    # OpenCode's XDG data root is linked to the config-store root, so these
    # config-relative paths are the top-level runtime data it writes there.
    - storage/
    - plans/
    - snapshot/
    - worktree/
    - repos/
    - opencode*.db*
    # Full truncated tool output remains addressable from session history.
    - tool-output/
    # MCP OAuth remains project-scoped with the rest of the tool data.
    - mcp-auth.json
    # The separate XDG state root is redirected here by setup.sh.
    - xdg-state/
  settingsFile: opencode-settings.json
  settingsTarget: .config/opencode/opencode.json
  yoloEnabled: true
  continueArgs: [--continue]
  passthroughPaths:
    - AGENTS.md
    - agent/
    - agents/
    - command/
    - commands/
    - config.json
    - mode/
    - modes/
    - opencode.json
    - opencode.jsonc
    - plugin/
    - plugins/
    - skill/
    - skills/
    - tui.json
    - tui.jsonc

credentials:
  sources:
    chatgpt-oauth: { apiKey: false }
    copilot-oauth: { apiKey: false }
    openai-api-key: { env: [OPENAI_API_KEY] }
    anthropic-api-key: { env: [ANTHROPIC_API_KEY] }
    gemini-api-key: { env: [GEMINI_API_KEY] }

network:
  serviceDomains:
    api.openai.com: openai-api-key
    "*.openai.com": openai-api-key
    api.anthropic.com: anthropic-api-key
    "*.anthropic.com": anthropic-api-key
    generativelanguage.googleapis.com: gemini-api-key
  serviceAuth:
    copilot-oauth: { headerName: Authorization, valueFormat: "Bearer %s", hosts: ["*.githubcopilot.com"] }
    chatgpt-oauth: { headerName: authorization, valueFormat: "Bearer %s", hosts: [chatgpt.com] }
    openai-api-key: { headerName: authorization, valueFormat: "Bearer %s" }
    anthropic-api-key: { headerName: x-api-key }
    gemini-api-key: { headerName: x-goog-api-key }

providers:
  - name: openai
    authSecrets:
      - file: auth.json
        codec: provider-map
        fields:
          - { pointer: /openai/key, kind: apiKey, release: openai-api-key }
          - { pointer: /anthropic/key, kind: apiKey, release: anthropic-api-key }
          - { pointer: /google/key, kind: apiKey, release: gemini-api-key }
          - { pointer: /gemini/key, kind: apiKey, release: gemini-api-key }
          - { pointer: /openai/access, kind: access, release: chatgpt-oauth, placeholder: { shape: jwt } }
          - { pointer: /openai/refresh, kind: refresh }
          - { pointer: /github-copilot/access, kind: access, release: copilot-oauth, placeholder: { prefix: gho_, random: { encoding: alphanumeric, length: 36 } } }
          - { pointer: /github-copilot/refresh, kind: refresh, placeholder: { prefix: gho_, random: { encoding: alphanumeric, length: 36 } } }
    tokenEndpoint:
      host: auth.openai.com
      path: /oauth/token
      body: either
      grants: [authorization_code, refresh_token]
      fields: { access: access_token, refresh: refresh_token, id: id_token, expiresIn: expires_in, scope: scope }
    credentials: [openai-api-key]
    authFiles: [auth.json]
    authSession:
      checks:
        - { file: auth.json, type: json_pointer_non_null, pointer: /openai }
    oauthPorts: [{ port: "1455" }]
  - name: anthropic
    credentials: [anthropic-api-key]
  - name: gemini
    credentials: [gemini-api-key]
  - name: github-copilot
    tokenEndpoint:
      host: github.com
      path: /login/oauth/access_token
      body: either
      grants: ["urn:ietf:params:oauth:grant-type:device_code"]
      fields: { access: access_token, refresh: access_token, scope: scope }
    authFiles: [auth.json]
    authSession:
      checks:
        - { file: auth.json, type: json_pointer_non_null, pointer: /github-copilot }
  - name: github-copilot-enterprise
    authFiles: [auth.json]
    authSession:
      checks:
        - { file: auth.json, type: json_pointer_non_null, pointer: /github-copilot-enterprise }
