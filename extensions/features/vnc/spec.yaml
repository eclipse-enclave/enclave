schemaVersion: "1"
kind: mixin
name: vnc
displayName: VNC
description: >-
  Virtual X display with a contained Chromium browser, served over VNC (RFB).
  Opt-in. The raw RFB port is published so any VNC client can attach.
defaultEnabled: false
needsRoot: true
failOnInstallError: true
priority: 75
aptPackages:
  - tigervnc-standalone-server
  - chromium
  - matchbox-window-manager
  - xdg-utils
  - fonts-liberation
  - fonts-dejavu-core
  # Generates the RFB VncAuth file: TigerVNC 1.15 (Debian 13) no longer ships a
  # vncpasswd binary, so the supervisor derives it via python3-cryptography.
  - python3
  - python3-cryptography
commands:
  startup:
    - command: [/usr/local/bin/vnc-supervisor]
      background: true
      description: VNC stack (Xvnc, window manager, Chromium)
ports:
  - container: 5900
    hostAllocation: auto
    publish: true
    label: VNC (RFB)
    openUrl: "vnc://localhost:{host_port}"
