name: Reusable Debian Package Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner image for the Debian package build.
        required: false
        type: string
        default: ubuntu-24.04
      artifact_name:
        description: Uploaded artifact name.
        required: false
        type: string
        default: deb
      artifact_retention_days:
        description: Uploaded artifact retention in days.
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package version derives from the latest release tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper

      - name: Build Debian package
        run: |
          make deb-quick \
            BUILD_COMMIT="$(git rev-parse --short HEAD)" \
            BUILD_DATE="$(git show -s --format=%cs HEAD)"

      - name: Verify packaged runtime assets
        run: |
          pkg=$(ls dist/enclave_*.deb)
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          dpkg-deb -x "$pkg" "$tmpdir"
          ./scripts/verify-package-assets.sh "$tmpdir" usr/share/zsh/vendor-completions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.deb
          retention-days: ${{ inputs.artifact_retention_days }}
