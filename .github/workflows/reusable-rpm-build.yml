name: Reusable RPM Package Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner image for the Ubuntu RPM compatibility build.
        required: false
        type: string
        default: ubuntu-24.04
      artifact_name:
        description: Uploaded artifact name.
        required: false
        type: string
        default: rpm
      artifact_retention_days:
        description: Uploaded artifact retention in days.
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build-rpm-ubuntu:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package version derives from the latest release tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Build RPM package
        run: make rpm

      - name: Verify packaged runtime assets
        run: |
          pkg=$(find dist -maxdepth 1 -name 'enclave-*.rpm' -print -quit)
          if [ -z "$pkg" ]; then
            echo "RPM package was not produced" >&2
            exit 1
          fi
          pkg=$(realpath "$pkg")
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          (cd "$tmpdir" && rpm2cpio "$pkg" | cpio -idm --quiet)
          ./scripts/verify-package-assets.sh "$tmpdir" usr/share/zsh/site-functions

  build-rpm-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y git golang make rpm-build cpio diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM package
        run: make rpm

      - name: Verify packaged runtime assets
        run: |
          pkg=$(find dist -maxdepth 1 -name 'enclave-*.rpm' -print -quit)
          if [ -z "$pkg" ]; then
            echo "RPM package was not produced" >&2
            exit 1
          fi
          pkg=$(realpath "$pkg")
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          (cd "$tmpdir" && rpm2cpio "$pkg" | cpio -idm --quiet)
          ./scripts/verify-package-assets.sh "$tmpdir" usr/share/zsh/site-functions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.rpm
          retention-days: ${{ inputs.artifact_retention_days }}

  test-fedora:
    needs: build-rpm-fedora
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Install and remove RPM package
        run: |
          dnf install -y ./dist/enclave-*.x86_64.rpm
          rpm --query enclave
          docker --version
          docker buildx version
          # The job container runs as root, which enclave refuses without an opt-in.
          if output=$(env -u ENCLAVE_ALLOW_ROOT enclave tools 2>&1); then
            echo "enclave ran as root without --allow-root" >&2
            exit 1
          fi
          case "$output" in
            *"refusing to run as root"*) ;;
            *)
              printf 'unexpected failure as root:\n%s\n' "$output" >&2
              exit 1
              ;;
          esac
          enclave --allow-root tools >/dev/null
          dnf remove -y enclave
          test ! -e /usr/bin/enclave
          test ! -e /usr/share/enclave
          test ! -e /usr/share/doc/enclave
