# SECURITY: called by Build website preview, so github.event is its
# pull_request_target event. Runs no PR code; the site artifact is only data.

name: Deploy website preview

on:
  workflow_call:
    secrets:
      DEPLOY_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # The PR's deployments and its removal run one at a time, in queue order,
    # so a later deployment never replaces a removal.
    concurrency:
      group: website-preview-${{ github.event.pull_request.number }}
      queue: max
    steps:
      # The event is a snapshot: deploy only if the PR is still open at the
      # built commit.
      - name: Check the PR is open at the built commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.state) \(.head.sha)"')
          read -r state head <<<"$pr"
          if [ "$state" = open ] && [ "$head" = "$HEAD_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #$NUMBER is $state at $head, not open at $HEAD_SHA: skipping the preview"
          fi
      - name: Checkout
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download site artifact
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ./public
      - name: Deploy preview
        id: deployment
        if: steps.pr.outputs.deploy == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./public
          preview-branch: previews
          umbrella-dir: pr-previews
          deploy-repository: eclipse-enclave/enclave-website-previews
          token: ${{ secrets.DEPLOY_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          action: deploy
          comment: false
      - name: Comment preview URL on the PR
        if: steps.pr.outputs.deploy == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            :rocket: Deployed preview to ${{ steps.deployment.outputs.deployment-url }}
